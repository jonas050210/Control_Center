name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Package the Godot project source
        run: |
          git archive --format=zip --prefix=SandboxAI-Godot/ \
            --output=SandboxAI-Godot-${GITHUB_REF_NAME}.zip HEAD \
            project.godot icon.svg scenes scripts

      - name: Upload reproducible build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandboxai-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip
