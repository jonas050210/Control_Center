name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The package version has a single source (pyproject.toml; __init__
      # reads it back through importlib.metadata). A tag that disagrees with
      # it would ship a wheel whose filename lies, so fail before building.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {tag!r} != pyproject version {version!r}")
          print(f"tag and package version agree: {version}")
          PY

      - name: Build Python wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Package the Godot project source
        run: |
          git archive --format=zip --prefix=SandboxAI-Godot/ \
            --output="SandboxAI-Godot-${GITHUB_REF_NAME}.zip" HEAD \
            project.godot icon.svg LICENSE scenes scripts

      - name: Upload reproducible build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandboxai-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip
