name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The package version has a single source (pyproject.toml; __init__
      # reads it back through importlib.metadata). A tag that disagrees with
      # it would ship a wheel whose filename lies, so fail before building.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag {tag!r} != pyproject version {version!r}")
          print(f"tag and package version agree: {version}")
          PY

      - name: Build Python wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Package the Godot project source
        run: |
          git archive --format=zip --prefix=SandboxAI-Godot/ \
            --output="SandboxAI-Godot-${GITHUB_REF_NAME}.zip" HEAD \
            project.godot icon.svg LICENSE scenes scripts

      - name: Upload reproducible build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandboxai-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            SandboxAI-Godot-*.zip
