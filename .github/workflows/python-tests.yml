name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (pyflakes-equivalent checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install -e ".[lint]"

      - name: Run ruff
        run: ruff check .

  core-tests:
    name: pytest (core, numpy-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with only the hard/test dependencies
        run: pip install -e ".[test]"

      - name: Run the Python suite
        run: PYTHONPATH=python python -m pytest python/tests -q

  full-tests:
    name: pytest (full training extras, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Python suite had never run on Windows CI before this workflow
    # (the pre-existing godot-tests.yml only ran it on ubuntu-latest). The
    # first Windows run here found 10 pre-existing test failures, none of
    # them a real product bug - all ten were test-fixture issues that only
    # a real Windows runner could surface (see git history / test-file
    # comments for the full diagnosis of each): missing os.name/USERPROFILE
    # mocks, a resolved-vs-raw path comparison, a POSIX-only fake
    # executable, a ProcessManager background-thread race, and four tests
    # in test_wsl_interop.py that mock is_wsl()=True (simulating being
    # inside real WSL, always a POSIX host) while running under native
    # Windows' WindowsPath, which resolves their fake POSIX-ish
    # intermediate path by inventing a drive letter from cwd instead of
    # behaving like a real POSIX filesystem. All ten now have fixes;
    # continue-on-error stays here as a safety net (so a genuine future
    # Windows-only regression is reported, not silently blocking) but is
    # expected to run clean.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with training + test extras
        run: pip install -e ".[test,training]"

      - name: Run the Python suite (bash)
        if: runner.os != 'Windows'
        run: PYTHONPATH=python python -m pytest python/tests -q

      - name: Run the Python suite (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python"
          python -m pytest python/tests -q
