name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (pyflakes-equivalent checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install -e ".[lint]"

      - name: Run ruff
        run: ruff check .

  core-tests:
    name: pytest (core, numpy-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with only the hard/test dependencies
        run: pip install -e ".[test]"

      - name: Run the Python suite
        run: PYTHONPATH=python python -m pytest python/tests -q

  desktop-ui-tests:
    name: Desktop UI tests (virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Build every desktop page on a real Tk interpreter
        run: xvfb-run -a python -m pytest python/tests/test_control_center_desktop.py -q
        env:
          PYTHONPATH: python

  full-tests:
    name: pytest (full training extras, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows CI previously found 10 pre-existing, Windows-only test-fixture
    # bugs (see git history around commits 86cdff8/386c341 for the full
    # diagnosis of each). All ten are fixed and this leg has run green on
    # windows-latest since; continue-on-error was removed once that was
    # confirmed so a genuine future regression here blocks merges like any
    # other leg. No macOS leg: the project's two real target environments
    # are native Windows and Linux/WSL (a Windows-desktop project folder
    # opened from Ubuntu/WSL is a real Linux userspace - is_wsl() sees a
    # genuine POSIX host - not native Windows), and macOS is explicitly out
    # of scope.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with training + test extras
        run: pip install -e ".[test,training]"

      - name: Run the Python suite (bash)
        if: runner.os != 'Windows'
        run: PYTHONPATH=python python -m pytest python/tests -q

      - name: Run the Python suite (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python"
          python -m pytest python/tests -q
