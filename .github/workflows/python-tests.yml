name: Python tests

# The Python half of the repository: lint, formatting, the test suite on the
# two real target platforms, coverage, and a dependency audit. The Godot half
# lives in godot-tests.yml; neither workflow runs the other's suite, so a
# push costs one run of each instead of two runs of the Python suite.

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  # write, not read: the failure-diagnostics commit comment needs it.
  # Nothing else in this workflow writes to the repository.
  contents: write

# A new push to the same ref makes the in-flight run obsolete. `main` is
# exempt so the history of what actually landed stays complete.
concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tooling
        run: pip install -e ".[lint]"

      - name: Run ruff (lint)
        run: ruff check --output-format=github .

      - name: Run ruff (formatting)
        run: ruff format --check --diff .

  typecheck:
    name: mypy (package, training extras installed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The training extras are installed on purpose: the package ships
      # py.typed, and checking it against `Any` stand-ins for torch,
      # gymnasium and stable-baselines3 would not verify the annotations
      # downstream code actually consumes.
      - name: Install the package with the typecheck and training extras
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[typecheck,training]"

      - name: Run mypy
        run: mypy

  core-tests:
    name: pytest (core, numpy-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with only the hard/test dependencies
        run: pip install -e ".[test]"

      # Proves the "core Python needs only NumPy" constraint from PROJECT.md:
      # every optional-extra test must skip here rather than fail.
      - name: Run the Python suite
        run: python -m pytest python/tests -q

  gdscript-checks:
    name: GDScript (static analysis, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the GDScript tooling extra
        run: pip install -e ".[test,gdscript]"

      # On a runner without the engine this is the only thing between a
      # GDScript typo and a runtime failure, so it must not be allowed to
      # skip: the extra is installed above and the tests assert on it.
      - name: Static analysis (real grammar parse, symbols, call arity)
        run: python -m pytest python/tests/test_gdscript_static.py -q

      - name: gdlint
        run: gdlint scripts tests

      - name: gdformat
        run: gdformat --check scripts tests

  desktop-ui-tests:
    name: Desktop UI tests (virtual display)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install virtual display and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-venv

      # actions/setup-python is intentionally not used here: its standalone
      # interpreter cannot see Ubuntu's python3-tk system package. A venv over
      # the system interpreter keeps Tk available while isolating test deps.
      - name: Install test dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages .ui-venv
          .ui-venv/bin/python -m pip install -e ".[test]"

      # tee'd and reported on failure for the same reason as full-tests:
      # the raw Actions log lives behind a blob store that is not always
      # reachable, and "exit code 1" is not a diagnosis.
      # Same entry point a contributor runs locally (`tools/desktop_tests.py`),
      # so the runner itself - its Tk/display detection and its `--strict`
      # path - is exercised on every CI run instead of being an untested
      # convenience script. Here the display already exists, so it goes
      # straight to the suite.
      - name: Build every desktop page on a real Tk interpreter
        run: |
          set -o pipefail
          .ui-venv/bin/python tools/desktop_tests.py --strict -- -rf 2>&1 | tee pytest-output.txt

      # The smoke harness drives the same pages without Tk (it installs its
      # own stub), so it also catches callback code the page-building pytest
      # file never reaches: background completions, theme/density/motion
      # cycles, the layout studio and the presets. Run both - a page can pass
      # one and fail the other.
      - name: Drive every page through the headless smoke harness
        run: .ui-venv/bin/python tools/control_center_smoke.py

      - name: Publish the failures to the job summary
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os

          path = "pytest-output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          # Head first: pytest prints the failing test, its assertion and the
          # traceback before the summary, and a timeout dump puts the MAIN
          # thread's stack at the top - the tail alone shows consequences.
          print("### Desktop UI tests failed\n")
          print("```text")
          print(raw[:40000])
          print("```")
          if len(raw) > 40000:
              print("\n### Tail (last 40000 chars)\n")
              print("```text")
              print(raw[-40000:])
              print("```")
          PY

      - name: Comment on the commit when the suite fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "pytest-output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          body = f"### :x: Desktop UI tests failed\n```text\n{raw[-40000:]}\n```"
          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --method POST --input payload.json

  full-tests:
    name: pytest (full training extras, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows training stack can consume most of the former 20-minute
    # budget while resolving native scientific wheels before pytest starts.
    # Let the required full suite complete rather than cancelling it without
    # a test result; the matrix remains fail-fast false for clear diagnostics.
    timeout-minutes: 30
    # The tests create many deliberately tiny torch/SB3 models. Letting a
    # high-core Windows runner fan each tiny operation out across all native
    # worker threads made the required suite take longer than its timeout.
    # The suite verifies behavior, not CPU scaling, so a single controlled
    # math thread is both deterministic and dramatically more responsive.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    # Windows CI previously found 10 pre-existing, Windows-only test-fixture
    # bugs (see git history around commits 86cdff8/386c341 for the full
    # diagnosis of each). All ten are fixed and this leg has run green on
    # windows-latest since; continue-on-error was removed once that was
    # confirmed so a genuine future regression here blocks merges like any
    # other leg. No macOS leg: the project's two real target environments
    # are native Windows and Linux/WSL (a Windows-desktop project folder
    # opened from Ubuntu/WSL is a real Linux userspace - is_wsl() sees a
    # genuine POSIX host - not native Windows), and macOS is explicitly out
    # of scope.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with training + test extras
        run: pip install -e ".[test,training]"

      # tee'd to a file so the failure survives into the job summary below.
      # Downloading raw Actions logs needs network access to the blob
      # store, which is not always available to whoever is debugging;
      # the summary is rendered in the web UI and costs nothing.
      - name: Run the Python suite
        shell: bash
        run: |
          set -o pipefail
          # Verbose names + unbuffered output make a platform-specific stall
          # diagnosable from the live Actions log instead of a row of dots.
          python -m pytest python/tests -vv -rf 2>&1 | tee pytest-output.txt

      - name: Publish the failures to the job summary
        if: failure()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os

          path = "pytest-output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          print(f"### pytest failed on {os.environ.get('RUNNER_OS', '?')}\n")
          print("```text")
          print(raw[-40000:])
          print("```")
          PY

      # Same reasoning as the summary step, one layer more robust: a commit
      # comment is readable through the plain REST API, so a failure can be
      # diagnosed without reaching the Actions log blob store at all. Only
      # on failure - a comment on every green run is noise that buries the
      # real ones, which godot-tests.yml learned the hard way.
      - name: Comment on the commit when the suite fails
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "pytest-output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          body = (
              f"### :x: Python suite failed on {os.environ.get('RUNNER_OS', '?')}\n"
              f"```text\n{raw[-40000:]}\n```"
          )
          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --method POST --input payload.json

  coverage:
    name: Coverage (training extras, gate 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with training + test extras
        run: pip install -e ".[test,training]" coverage

      # The Tk desktop pages cannot be imported on a headless runner without
      # the system Tk package; they are covered by desktop-ui-tests instead
      # and excluded in pyproject's [tool.coverage.run].
      - name: Measure coverage
        run: |
          coverage run -m pytest python/tests -q
          coverage report
          coverage xml

      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo "### Python coverage"
            echo ''
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the declared dependency graph, not a lockfile: the lockfile in
      # the repo is Linux/CPU-only on purpose (see its header) and would give
      # a misleading picture for the Windows leg.
      - name: Collect the declared dependencies
        run: |
          python - <<'PY' > audited-requirements.txt
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          requirements = list(project["dependencies"])
          requirements += project["optional-dependencies"]["training"]
          print("\n".join(requirements))
          PY
          cat audited-requirements.txt

      - name: Audit
        run: pip-audit --strict --progress-spinner=off -r audited-requirements.txt
