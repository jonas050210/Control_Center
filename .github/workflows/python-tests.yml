name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (pyflakes-equivalent checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install -e ".[lint]"

      - name: Run ruff
        run: ruff check .

  core-tests:
    name: pytest (core, numpy-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with only the hard/test dependencies
        run: pip install -e ".[test]"

      - name: Run the Python suite
        run: PYTHONPATH=python python -m pytest python/tests -q

  full-tests:
    name: pytest (full training extras, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Python suite had never run on Windows CI before this workflow
    # (the pre-existing godot-tests.yml only ran it on ubuntu-latest). The
    # first Windows run here found ~10 pre-existing, real failures specific
    # to native Windows (not WSL): WSL-path-translation string building in
    # test_wsl_interop.py, tilde-expansion in test_config.py, a short-name
    # vs long-name path mismatch in test_control_center_desktop.py, a
    # Godot version-string parse mismatch in test_manifest.py, and a
    # process-kill assertion in test_adapter.py. None of these can be
    # safely diagnosed or fixed from a Linux sandbox without guessing at
    # real Windows behaviour, so this leg is non-blocking (continue-on
    # -error) until someone with real Windows access fixes them - but it
    # keeps running and reporting so the failures stay visible instead of
    # silently disappearing.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with training + test extras
        run: pip install -e ".[test,training]"

      - name: Run the Python suite (bash)
        if: runner.os != 'Windows'
        run: PYTHONPATH=python python -m pytest python/tests -q

      - name: Run the Python suite (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "python"
          python -m pytest python/tests -q
