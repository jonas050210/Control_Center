name: Godot tests

# The engine half of the repository: the headless GDScript suite on the two
# real target platforms. Lint, static analysis and the Python suite live in
# python-tests.yml - running them here as well doubled every push's CI cost
# for no extra signal.

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the failure-diagnostics commit comment

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: "4.7.2"

jobs:
  headless-tests:
    name: Godot headless suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine download is ~50 MB and the release is immutable, so a
      # version-keyed cache turns it into a no-op on every rerun.
      - name: Restore the cached Godot build
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Download Godot (Linux)
        if: runner.os == 'Linux' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o -q godot.zip -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Download Godot (Windows)
        if: runner.os == 'Windows' && steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = $env:GODOT_VERSION
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip" `
            -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot

      - name: Run the headless suite (Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          "./godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . --script res://tests/run_tests.gd 2>&1 | tee godot_output.txt

      - name: Run the headless suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Prefer the *_console.exe build: the plain one detaches from the
          # console on Windows and CI captures no output at all.
          $godot = (Get-ChildItem -Path godot -Recurse -Filter "*_console.exe").FullName | Select-Object -First 1
          if (-not $godot) {
            $godot = (Get-ChildItem -Path godot -Recurse -Filter "Godot_v$($env:GODOT_VERSION)-stable_win64.exe").FullName | Select-Object -First 1
          }
          Write-Host "Using Godot: $godot"
          & $godot --headless --path . --script res://tests/run_tests.gd 2>&1 | Tee-Object -FilePath godot_output.txt
          exit $LASTEXITCODE

      # The suite prints one PASS/FAIL line per test; the tail is what a
      # maintainer actually reads. It goes to the job summary on every run
      # (free, no API call, no repo noise).
      - name: Publish the suite output to the job summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os

          path = "godot_output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          if len(raw) > 50000:
              raw = raw[-50000:]
          print(f"### Godot suite output ({os.environ.get('RUNNER_OS', '?')}, tail)\n")
          print("```text")
          print(raw)
          print("```")
          PY

      # A commit comment is a push notification, so it is reserved for
      # failures. Green runs used to post a 55 KB comment on every single
      # push, which buried the real ones.
      - name: Comment on the commit when the suite fails
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = "godot_output.txt"
          raw = (
              open(path, encoding="utf-8", errors="replace").read()
              if os.path.exists(path)
              else "(no output captured)"
          )
          if len(raw) > 50000:
              raw = raw[-50000:]
          body = (
              f"### :x: Godot suite failed on {os.environ.get('RUNNER_OS', '?')} (tail)\n"
              f"```text\n{raw}\n```"
          )
          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --method POST --input payload.json
