; SandboxAI overlay: export presets for the godot_rl_agents VirtualCamera
; example (pixel-observation environment for feasibility Test C).
;   Windows: build/virtualcamera_windows.exe
;   Linux:   build/virtualcamera_linux.x86_64
; The PCK is embedded so each environment is a single self-contained file.

[preset.0]

