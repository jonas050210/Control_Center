; SandboxAI overlay: export presets for the godot_rl_agents FPS example.
; godot-rl (0.8.2) launches the env executable directly with
; `--port=<p> --env_seed=<s>` (and `--headless --disable-render-loop` when the
; window is hidden), so the environment MUST be a real exported game binary:
;   Windows: build/fps_windows.exe   (GodotEnv requires the .exe suffix)
;   Linux:   build/fps_linux.x86_64  (GodotEnv requires the .x86_64 suffix)
; The PCK is embedded so each environment is a single self-contained file.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/fps_windows.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architectures="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="SandboxAI Feasibility - FPS"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

[preset.1]

name="Linux/X11"
platform="Linux/X11"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/fps_linux.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architectures="x86_64"
ssh_remote_deploy/enabled=false
