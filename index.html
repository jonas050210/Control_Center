<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Lokales Control Center für Ideen und Projekte.">
  <title>Control Center — Projektbibliothek</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2311141b'/%3E%3Cpath d='M12 13h7v7h-7zm9 0h7v7h-7zm-9 9h7v7h-7zm9 0h7v7h-7z' fill='%23c6f432'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <a class="brand" href="#library" aria-label="Control Center Startseite">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
        </span>
        <span class="brand-copy"><strong>CONTROL<span>CENTER</span></strong><small>DEIN PROJEKT-HUB</small></span>
      </a>

      <div class="workspace-switcher" aria-label="Aktueller Arbeitsbereich">
        <span class="workspace-avatar">C</span>
        <span class="workspace-copy"><b>Mein Workspace</b><small>Persönliche Bibliothek</small></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
      </div>

      <nav class="nav-list" aria-label="Bereiche">
        <p class="nav-label">WORKSPACE</p>
        <button class="nav-item active" type="button" data-view="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7" height="7" rx="1.5"/><rect x="13.5" y="4" width="7" height="7" rx="1.5"/><rect x="3.5" y="14" width="7" height="7" rx="1.5"/><rect x="13.5" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Bibliothek</span><span class="nav-count" id="project-count">00</span>
        </button>
      </nav>

      <div class="sidebar-grow"></div>

      <div class="local-card">
        <span class="local-pulse" aria-hidden="true"></span>
        <div><b>Lokale Bibliothek</b><small>Projekte und Ideen bleiben auf diesem Rechner</small></div>
      </div>
      <div class="sidebar-bottom"><span class="version-dot"></span> CONTROL CENTER <span class="version-number">VORSCHAU</span></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumb"><span>Mein Workspace</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><b id="breadcrumb-current">Bibliothek</b></div>
        <div class="topbar-actions">
          <label class="global-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>
            <input id="global-search" type="search" placeholder="Projekte suchen…" autocomplete="off" aria-label="Projekte suchen">
            <kbd>Ctrl K</kbd>
          </label>
          <span class="topbar-divider" aria-hidden="true"></span>
          <button class="icon-button command-button" type="button" data-action="open-command" aria-label="Schnellaktionen öffnen" title="Schnellaktionen · Ctrl+K"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h6M5 12h10M5 17h14"/><path d="m16 5 3 2-3 2"/></svg></button>
          <button class="icon-button help-button" type="button" data-action="show-about" aria-label="Über diese Vorschau" title="Über diese Vorschau">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.7c-1.1 1-1.7 1.2-1.7 2.8m0 3h.01"/></svg>
          </button>
          <span class="user-avatar" aria-label="Lokaler Workspace">C</span>
        </div>
      </header>

      <main class="page" id="page" tabindex="-1"></main>
      <footer class="main-footer"><span>CONTROL CENTER</span><span>Lokaler Workspace <i></i> Dateiaktionen bleiben am Server-PC</span></footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
