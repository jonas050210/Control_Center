# Local pre-commit hooks mirroring the CI gates that are cheap enough to run
# on every commit. Install once with:
#
#   pip install pre-commit && pre-commit install
#
# The expensive gates (pytest, the Godot headless suite) stay in CI.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # GDScript is tab-indented and gdformat owns its whitespace.
        exclude: \.gd$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy is intentionally NOT a pre-commit hook: it needs the training
  # extras installed to check anything meaningful, which is too heavy for
  # a per-commit gate. The CI "typecheck" job owns it; run `mypy` by hand
  # before pushing a change to the package's public surface.

  # gdtoolkit publishes no pre-commit hook repository, so these run from the
  # environment the contributor already needs (`pip install -e ".[dev]"`).
  - repo: local
    hooks:
      - id: gdformat
        name: gdformat
        entry: gdformat
        language: system
        types: [file]
        files: \.gd$
      - id: gdlint
        name: gdlint
        entry: gdlint
        language: system
        types: [file]
        files: \.gd$
