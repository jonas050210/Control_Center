[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxai"
version = "0.3.0"
description = "Local PPO, behavior cloning and evaluation tooling for SandboxAI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
training = [
  "torch>=2.1",
  "gymnasium>=0.29",
  "stable-baselines3>=2.2",
  "tensorboard>=2.14",
  "psutil>=5.9",
]
test = [
  "pytest>=7.4",
]
# GDScript tooling: real grammar parsing (gdparse) and style rules (gdlint)
# used by python/sandboxai/gdscript_analysis.py. Optional because it is only
# needed to verify the Godot half of the repository.
gdscript = [
  "gdtoolkit>=4.3,<5",
]
# Static analysis for the Python package/tests (CI "lint" job). Kept separate
# from `test` so running the suite locally never requires it.
lint = [
  "ruff>=0.6",
]

[project.scripts]
sandboxai = "sandboxai.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-dir]
"" = "python"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only pyflakes-equivalent checks (undefined names, unused imports/variables,
# etc.). Style/formatting rules are deliberately out of scope for now so this
# does not turn into an unrelated repo-wide reformat.
select = ["F"]
