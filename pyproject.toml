[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxai"
version = "0.2.0"
description = "Local PPO, behavior cloning and evaluation tooling for SandboxAI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
training = [
  "torch>=2.1",
  "gymnasium>=0.29",
  "stable-baselines3>=2.2",
  "tensorboard>=2.14",
  "psutil>=5.9",
]
test = [
  "pytest>=7.4",
]

[project.scripts]
sandboxai = "sandboxai.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-dir]
"" = "python"
