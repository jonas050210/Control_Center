[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketai"
version = "0.1.0"
description = "Train a Rocket League AI in RocketSim and play it in the real game through RLBot v5."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "rlgym[rl-sim]==2.0.1",
  "rocketsim==2.2.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# RLBot v5 is still a pre-release; it is only needed to play in the real game.
rlbot = ["rlbot==2.0.0b56"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
rocketai = "rocketai.cli:main"

[tool.setuptools.packages.find]
include = ["rocketai*"]

[tool.setuptools.package-data]
rocketai = ["web/*", "rlbot_bot/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
