[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxai-local"
version = "2.0.0"
description = "Local-first vision imitation and reinforcement learning platform for a controlled FPS sandbox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10.0",
  "mss>=9.0",
  "pynput>=1.7.6; platform_system == 'Windows'",
  "psutil>=5.9",
  "torch>=2.2",
  "gymnasium==1.0.0",
  "stable-baselines3==2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sandboxai = "sandboxai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandboxai*", "data_pipeline*", "bc*", "sandbox*", "rl*", "evaluation*", "monitoring*"]

[tool.setuptools.package-data]
sandbox = ["godot_project/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
